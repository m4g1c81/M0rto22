<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F6F7F2;--card:#FFFFFF;--ink:#1B2316;--muted:#586152;--faint:#6E7766;--line:#E3E6DC;--line2:#EEF0E8;
  --brand:#2F6B2F;--brand-d:#1F4D1F;--brand-ink:#FFFFFF;--brand-soft:#E5F0DF;--sel:#EAF4E4;--sel-line:#2F6B2F;
  --egg:#F4B400;--egg-d:#8A5A00;--egg-soft:#FFF3CC;--egg-ink:#7A4F00;--sum:#FFF6D9;--sum-ink:#3B2E0A;
  --warn-bg:#FDF0E1;--warn:#8A3E05;--warn-2:#F6D9B5;--warn-ink:#6B3A10;
  --feed:#6B4A1E;--feed-soft:#EEE7DA;--feedbar:#2F6B2F;
  --danger:#A8321F;--danger-soft:#FBE3DA;--seg:#E8EBE2;--hero:#2F6B2F;
  --shadow:0 1px 3px rgba(0,0,0,.12);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131711;--card:#1C2219;--ink:#EEF1E8;--muted:#A9B2A0;--faint:#929C8C;--line:#2D3528;--line2:#262E22;
  --brand:#86C06F;--brand-d:#A9D896;--brand-ink:#0F150C;--brand-soft:#24331D;--sel:#21321B;--sel-line:#86C06F;
  --egg:#F4B400;--egg-d:#F4C542;--egg-soft:#3A3014;--egg-ink:#F4D06F;--sum:#2E2812;--sum-ink:#F3E6BF;
  --warn-bg:#36230F;--warn:#F2B27A;--warn-2:#55361A;--warn-ink:#F2C9A0;
  --feed:#E0C08F;--feed-soft:#33291B;--feedbar:#86C06F;
  --danger:#F08A73;--danger-soft:#3A221B;--seg:#232A1F;--hero:#2C5F2C;--shadow:0 1px 3px rgba(0,0,0,.5);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,.row,a{touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior-y:none}
button{font-family:inherit;color:inherit;cursor:pointer}
main{padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 112px);max-width:560px;margin:0 auto}
main.withbar{padding-bottom:calc(env(safe-area-inset-bottom) + 196px)}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.head{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.eyebrow{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sub{font-size:15px;font-weight:600;color:var(--muted);margin:0}
.backlink{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;color:var(--brand);font-size:16px;font-weight:800;min-height:40px;margin-bottom:4px}
h2.st{margin:24px 0 10px;font-size:19px;font-weight:800}
.st-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.st-row h2.st{flex:1}
.link{border:0;background:none;padding:6px 0;color:var(--brand);font-size:15px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.card.list{padding:2px 14px}
.empty{text-align:center;padding:26px 16px;color:var(--muted);font-weight:600}
.empty .ei{width:64px;height:64px;border-radius:22px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 10px}
/* hero */
.hero{background:var(--hero);color:#fff;border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hero .hl{font-size:15px;font-weight:700;opacity:.92}
.bigrow{display:flex;align-items:baseline;gap:8px}
.big{font-size:60px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.unit{font-size:17px;font-weight:700;opacity:.92}
.eggbadge{width:64px;height:64px;border-radius:50%;background:var(--egg);color:#1B2316;display:grid;place-items:center;flex:none}
.prog-l{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
.progress{height:10px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.progress i{display:block;height:100%;background:var(--egg);border-radius:99px}
.btnw{border:0;background:#fff;color:#1F4D1F;border-radius:16px;min-height:52px;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
/* azioni rapide */
.actions3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.act{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:800;line-height:1.2;text-align:center}
.ib{width:48px;height:48px;border-radius:16px;display:grid;place-items:center}
.ib.egg{background:var(--egg-soft);color:var(--egg-d)}.ib.green{background:var(--brand-soft);color:var(--brand)}.ib.feed{background:var(--feed-soft);color:var(--feed)}.ib.gray{background:var(--seg);color:var(--muted)}
/* avvisi */
.alert{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;color:var(--ink)}
.alert .ai{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--seg);color:var(--muted)}
.alert .at{flex:1;display:flex;flex-direction:column;min-width:0}
.alert b{font-size:16px;font-weight:800}.alert small{font-size:14px;font-weight:600;color:var(--muted)}
.alert>svg{color:var(--muted);flex:none}
.alert.warn{background:var(--warn-bg);border-color:transparent}.alert.warn .ai{background:var(--warn-2);color:var(--warn)}.alert.warn small{color:var(--warn-ink)}.alert.warn>svg{color:var(--warn)}
.alert.ok .ai{background:var(--brand-soft);color:var(--brand)}
/* tessere */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:14px;font-weight:700;color:var(--muted)}
.tile .v{font-size:26px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px}
.tile .h{font-size:13px;font-weight:600;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-weight:800;line-height:1.1}.stat span{font-size:13px;font-weight:700;color:var(--muted)}
.stat.hl{background:var(--sel);border-color:transparent}.stat.hl b{color:var(--brand-d)}
/* segmentato */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--seg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{height:40px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
/* righe */
.row{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line2);background:none;color:var(--ink);min-height:56px}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;font-weight:600;color:var(--muted)}
.row>svg{color:var(--faint);flex:none}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.right b{font-size:16px;font-weight:800}.right span{font-size:12px;font-weight:700;color:var(--muted)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1B2316;flex:none}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;margin-left:4px;vertical-align:2px}
.tag.hen{background:var(--egg-soft);color:var(--egg-ink)}.tag.rooster{background:var(--danger-soft);color:var(--danger)}.tag.off{background:var(--seg);color:var(--muted)}
.dots{display:flex;gap:3px}.dots i{width:9px;height:12px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--egg)}
.legend{font-size:12.5px;font-weight:600;color:var(--faint);display:flex;align-items:center;gap:6px;margin:-2px 2px 10px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--egg);display:inline-block}
/* pollai */
.pcard{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:10px;color:var(--ink);display:block}
.pcard .ph{display:flex;width:100%;align-items:center;gap:12px}
.pcard .main{flex:1;min-width:0;display:flex;flex-direction:column}
.pcard .t{font-size:18px;font-weight:800}.pcard .s{font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.pcard .pst .c{display:block;background:var(--bg);border-radius:12px;padding:8px 4px;text-align:center}
.pcard .pst .c.hl{background:var(--egg-soft)}
.pcard .pst b{display:block;font-size:19px;font-weight:800}.pcard .pst .c span{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
/* raccolta */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar>button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.datebar>button:disabled{opacity:.4}
.datebox{flex:1;position:relative;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:800;color:var(--ink)}
.datebox svg{color:var(--brand)}
.datebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0}
.hint{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 12px}
.glabel{font-size:14px;font-weight:800;color:var(--muted);margin:14px 2px 8px;display:flex;align-items:center;gap:6px}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hcard{position:relative}
.hbtn{width:100%;min-height:122px;border-radius:20px;padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line)}
.hbtn.on{background:var(--sel);border-color:var(--sel-line)}
.hbtn .hn{font-size:15px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eggs{display:flex;gap:3px;height:16px;align-items:center;font-size:12px;font-weight:800;color:var(--egg-ink)}
.eggs small{font-size:12px;font-weight:700;color:var(--faint)}
.eggs i{width:13px;height:16px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;background:var(--egg);border:1.5px solid #B98500;display:inline-block}
.minus{position:absolute;top:3px;right:3px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:800;line-height:1;display:grid;place-items:center;padding:0}
.sumbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:5;background:var(--card);border-top:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px}
.sumbar .st2{flex:1;display:flex;flex-direction:column}
.sumbar b{font-size:24px;font-weight:800;line-height:1.1}.sumbar span{font-size:14px;font-weight:600;color:var(--muted)}
/* scheda gallina */
.profile{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.hen{background:var(--egg-soft);color:var(--egg-ink);border-color:transparent;font-weight:800}
.chip.rooster{background:var(--danger-soft);color:var(--danger);border-color:transparent;font-weight:800}
.summary{background:var(--sum);border-radius:20px;padding:16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.summary .si{width:40px;height:40px;border-radius:12px;background:var(--egg);color:#1B2316;display:grid;place-items:center;flex:none}
.summary p{margin:0;font-size:16px;font-weight:600;line-height:1.4;color:var(--sum-ink)}
.summary b{font-weight:800}
.daygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.daygrid div{display:flex;flex-direction:column;align-items:center;gap:3px}
.daygrid i{width:20px;height:26px;border-radius:50%;background:var(--bg);border:2px dashed var(--line);box-sizing:border-box}
.daygrid i.on{background:var(--egg);border:2px solid #C08A00}
.daygrid span{font-size:11px;font-weight:700;color:var(--faint)}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:120px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars b{font-size:12px;font-weight:800;color:var(--muted)}
.bars i{width:100%;border-radius:8px 8px 4px 4px;background:var(--egg);min-height:3px}
.bars i.cur{opacity:.55}
.bars span{font-size:11.5px;font-weight:700;color:var(--faint)}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.cardhead h3{margin:0;font-size:17px;font-weight:800}.cardhead span{font-size:13px;font-weight:700;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;font-weight:700}
/* mangime */
.sack{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.sack .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sack .lbl{font-size:14px;font-weight:700;color:var(--muted)}
.sack .rest{font-size:30px;font-weight:800;line-height:1.15}
.badge{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.ok{background:var(--brand-soft);color:var(--brand)}
.meter{height:14px;border-radius:99px;background:var(--line2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.meter i.low{background:#E08A1E}
.meterl{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;color:var(--muted)}
.note{font-size:13px;font-weight:600;color:var(--faint);margin:2px 2px 10px}
/* pulsanti */
.btn{appearance:none;border:0;border-radius:16px;min-height:52px;padding:0 18px;font-size:17px;font-weight:800;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%;display:flex}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.stack{display:flex;flex-direction:column;gap:8px}
/* grafici */
.chart-box{position:relative;height:210px}
.chart-title{font-weight:800;font-size:16px}
.chart-sub{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
/* barra in basso */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding:8px 4px calc(env(safe-area-inset-bottom) + 8px)}
nav.tabs button{border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;min-height:52px}
nav.tabs button.on{color:var(--brand);font-weight:800}
nav.tabs .plus{justify-content:flex-start}
nav.tabs .plus span{width:60px;height:60px;margin-top:-26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 8px 18px rgba(47,107,47,.35)}
/* foglio in basso */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,26,16,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-card{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:12px 20px calc(env(safe-area-inset-bottom) + 20px)}
.sheet-card::before{content:"";display:block;width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
@media(min-width:620px){.sheet{align-items:center}.sheet-card{border-radius:28px}}
.sheet-card h3{margin:0 0 14px;font-size:22px;font-weight:800}
.sheet-actions{display:flex;gap:10px;margin-top:8px}
.sheet-actions .btn{flex:1}
.addrow{width:100%;text-align:left;display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;border:0;min-height:68px;margin-bottom:10px;color:var(--ink)}
.addrow .ib{flex:none}
.addrow .at{flex:1;display:flex;flex-direction:column}
.addrow b{font-size:17px;font-weight:800}.addrow small{font-size:14px;font-weight:600;color:var(--muted)}
.addrow.egg{background:var(--egg-soft)}.addrow.green{background:var(--brand-soft)}.addrow.feed{background:var(--feed-soft)}.addrow.gray{background:var(--seg)}
.addrow.egg .ib{background:var(--egg);color:#1B2316}.addrow.green .ib{background:var(--brand);color:var(--brand-ink)}.addrow.feed .ib{background:#8A6430;color:#fff}.addrow.gray .ib{background:var(--muted);color:var(--card)}
/* moduli */
select,input,textarea{font-size:17px;line-height:1.3;font-family:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:700}
.segr{display:flex;background:var(--seg);border-radius:14px;padding:4px;margin-bottom:12px}
.segr label{flex:1;text-align:center;padding:10px;border-radius:11px;font-weight:800;cursor:pointer;color:var(--muted)}
.segr input{display:none}
.segr input:checked+label{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
/* varie */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.banner{background:var(--danger-soft);color:var(--danger);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700;margin-bottom:12px}
.foot{text-align:center;color:var(--faint);font-size:12.5px;font-weight:600;margin-top:28px}
.foot b{color:var(--muted)}

#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
 background:radial-gradient(500px 420px at 50% 38%, #8aa748 0%, transparent 70%), linear-gradient(160deg,#5f7d2c,#2f4818);transition:opacity .5s ease}
#splash img{width:120px;height:120px;border-radius:28px;box-shadow:0 18px 40px -12px rgba(10,20,0,.6);animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
#splash h1{font-family:"Nunito",system-ui,sans-serif;font-weight:800;color:#fff;font-size:40px;margin:24px 0 4px;letter-spacing:-1px;animation:up .6s .15s both}
#splash h1 span{color:#f2c463}
#splash p{margin:0;opacity:.88;letter-spacing:.04em;animation:up .6s .25s both}
#splash .f{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 30px);font-size:12.5px;opacity:.75;text-align:center}
#splash.out{opacity:0;pointer-events:none}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>

  <button data-act="tab" data-v="pollai"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V10l9-6 9 6v11"/><path d="M9 21v-6h6v6"/></svg>Pollai</button>
  <button class="plus" data-act="add" aria-label="Aggiungi"><span><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>

<div class="sheet hidden" id="sheet"><div class="sheet-card" id="sheetCard"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">

<script>
"use strict";
/* ================= Dati ================= */
const KEY = 'morto22-db-v1';
let storageOk = true;
function loadDB(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ storageOk = false; return null; } }
function saveDB(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); storageOk = true; }catch(e){ storageOk = false; } }
function normalize(d){
  d = d && typeof d === 'object' ? d : {};
  return { v:1, pollai: Array.isArray(d.pollai)?d.pollai:[], animali: Array.isArray(d.animali)?d.animali:[],
           uova: d.uova && typeof d.uova==='object' ? d.uova : {}, mangime: Array.isArray(d.mangime)?d.mangime:[] };
}
let db = normalize(loadDB());

const LOGO = document.querySelector('link[rel="icon"]').href;
const VERSIONE = '2.0.1';
const ANNO = 2026;
const firma = () => `<div class="foot"><b>MOrto22</b> · versione ${VERSIONE}<br>© ${ANNO} Marco · Tutti i diritti riservati</div>`;
const RAZZE = ['Livornese','Ancona','Padovana','Valdarnese','Siciliana','Robusta Maculata','Australorp','Orpington','Rhode Island Red','Sussex','Wyandotte','Brahma','Marans','Moroseta','Araucana','Plymouth Rock','Ovaiola rossa (ibrida)','Ovaiola bianca (ibrida)','Meticcia'];
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];

/* ================= Utilità ================= */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const fmtD = s => s ? s.split('-').reverse().join('/') : '—';
const fmtDLong = s => { const d = parseD(s); return d.toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long', year:'numeric'}); };
const nf0 = new Intl.NumberFormat('it-IT',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('it-IT',{maximumFractionDigits:1, minimumFractionDigits:0});
const nf2 = new Intl.NumberFormat('it-IT',{maximumFractionDigits:2, minimumFractionDigits:2});
const eur = v => '€ ' + nf2.format(v || 0);
const monthKey = s => s.slice(0,7);
const monthLabel = k => { const [y,m] = k.split('-'); return MESI[+m-1] + ' ' + y.slice(2); };

function spanStr(from, to){
  if(!from) return '—';
  to = to || today();
  const a = parseD(from), b = parseD(to);
  let m = (b.getFullYear()-a.getFullYear())*12 + b.getMonth()-a.getMonth();
  if(b.getDate() < a.getDate()) m--;
  if(m < 1){ const d = Math.max(0, daysBetween(from,to)); return d + (d===1?' giorno':' giorni'); }
  const y = Math.floor(m/12), r = m%12;
  return [y ? y + (y===1?' anno':' anni') : '', r ? r + (r===1?' mese':' mesi') : ''].filter(Boolean).join(' e ');
}
function lastMonths(n){ const out=[]; const d=new Date(); d.setDate(1); for(let i=n-1;i>=0;i--){ const x=new Date(d.getFullYear(), d.getMonth()-i, 1); out.push(`${x.getFullYear()}-${pad(x.getMonth()+1)}`);} return out; }
function lastDays(n){ const t=today(); const out=[]; for(let i=n-1;i>=0;i--) out.push(addDays(t,-i)); return out; }

const pollaio = id => db.pollai.find(p => p.id === id);
const animale = id => db.animali.find(a => a.id === id);
const attivi = list => list.filter(a => (a.stato||'attivo') === 'attivo');
const animaliDi = pid => db.animali.filter(a => a.pollaioId === pid);
const isHen = a => a.sesso === 'gallina';

function eggEntries(filterIds){
  const set = filterIds ? new Set(filterIds) : null, out = [];
  for(const [k,q] of Object.entries(db.uova)){
    const i = k.lastIndexOf('|'); const a = k.slice(0,i), d = k.slice(i+1);
    if(!set || set.has(a)) out.push({a, d, q:+q||0});
  }
  return out;
}
const sumQ = list => list.reduce((s,e) => s+e.q, 0);
function perDay(entries, days){ const m={}; entries.forEach(e => m[e.d]=(m[e.d]||0)+e.q); return days.map(d => m[d]||0); }
function perMonth(entries, months){ const m={}; entries.forEach(e => { const k=monthKey(e.d); m[k]=(m[k]||0)+e.q; }); return months.map(k => m[k]||0); }

function henStats(h){
  const e = eggEntries([h.id]).filter(x => x.q>0).sort((a,b) => a.d<b.d?-1:1);
  const tot = sumQ(e), t = today();
  const first = e[0]?.d, last = e.at(-1)?.d;
  const start = h.inizioDeposizione || first;
  const giorni = start ? Math.max(1, daysBetween(start, t)+1) : 0;
  const since30 = addDays(t,-29);
  const s30 = sumQ(e.filter(x => x.d >= since30));
  const days30 = start ? Math.min(30, Math.max(1, daysBetween(start > since30 ? start : since30, t)+1)) : 30;
  const months = {}; e.forEach(x => { const k=monthKey(x.d); months[k]=(months[k]||0)+x.q; });
  const best = Object.entries(months).sort((a,b)=>b[1]-a[1])[0];
  return { tot, first, last, start, giorni, media: giorni ? tot/giorni : 0, s30, tasso30: start ? s30/days30 : 0, best, entries:e };
}

function feedStats(list, nAnimali){
  const s = [...list].sort((a,b) => a.data<b.data?-1:1);
  const totKg = s.reduce((t,x)=>t+(+x.kg||0),0), totCost = s.reduce((t,x)=>t+(+x.costo||0),0);
  const r = { n:s.length, totKg, totCost, eurKg: totKg ? totCost/totKg : 0, stima:false };
  if(s.length >= 2){
    const days = daysBetween(s[0].data, s.at(-1).data);
    if(days > 0){
      const kg = totKg - (+s.at(-1).kg||0), c = totCost - (+s.at(-1).costo||0);
      r.kgDay = kg/days; r.costDay = c/days;
    }
  }
  if(r.kgDay == null && s.length){
    const days = Math.max(30, daysBetween(s[0].data, today()));
    r.kgDay = totKg/days; r.costDay = totCost/days; r.stima = true;
  }
  if(r.kgDay != null){ r.kgMese = r.kgDay*30.44; r.costMese = r.costDay*30.44; }
  r.gCapo = nAnimali && r.kgDay ? r.kgDay*1000/nAnimali : null;
  return r;
}

/* ================= UI helpers ================= */
let charts = [], after = [];
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), 2200); }
function tile(k, v, unit, hint, ic){ return `<div class="tile">${ic?`<span class="ic" aria-hidden="true">${ic}</span>`:''}<div class="k">${k}</div><div class="v">${v}${unit?`<small>${unit}</small>`:''}</div>${hint?`<div class="h">${hint}</div>`:''}</div>`; }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function chartCard(id, title, sub){ return `<div class="card"><div class="chart-title">${title}</div>${sub?`<div class="chart-sub">${sub}</div>`:''}<div class="chart-box"><canvas id="${id}" role="img" aria-label="${esc(title)}"></canvas></div></div>`; }
function chart(id, type, labels, data, o={}){
  after.push(() => {
    const el = document.getElementById(id); if(!el) return;
    if(!window.Chart){ el.parentElement.innerHTML = '<div class="empty">Grafico non disponibile (serve la connessione per caricarlo).</div>'; return; }
    const col = cssVar(o.color||'--egg'), ink = cssVar('--muted'), grid = cssVar('--line'), hz = !!o.horizontal;
    const valAxis = { beginAtZero:true, grid:{color:grid}, border:{display:false}, ticks:{color:ink, precision:o.precision??0, callback:o.tick} };
    const catAxis = { grid:{display:false}, border:{color:grid}, ticks:{color:ink, maxRotation:0, autoSkip:!hz, maxTicksLimit:hz?50:8} };
    charts.push(new Chart(el, {
      type,
      data:{ labels, datasets:[{ label:o.label||'', data, backgroundColor: type==='line' ? col+'2e' : col, borderColor: col,
        borderWidth: type==='line'?2:0, borderRadius:4, borderSkipped:'start', fill: type==='line', cubicInterpolationMode:'monotone',
        pointRadius:0, pointHoverRadius:5, pointHoverBackgroundColor:col, maxBarThickness:26 }]},
      options:{ indexAxis: hz?'y':'x', responsive:true, maintainAspectRatio:false, animation:{duration:300},
        interaction:{ mode:'index', intersect:false },
        plugins:{ legend:{display:false}, tooltip:{ displayColors:false, callbacks:{ label: c => (o.label?o.label+': ':'') + (o.fmt ? o.fmt(c.parsed[hz?'x':'y']) : c.formattedValue) } } },
        scales: hz ? { x:valAxis, y:catAxis } : { x:catAxis, y:valAxis } }
    }));
  });
}

function pollaioOptions(sel, withAll){
  return (withAll ? `<option value="">${withAll}</option>` : '') +
    db.pollai.map(p => `<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.nome)}</option>`).join('');
}

/* ===== Sheet (form / conferma) ===== */
let sheetSubmit = null, sheetOpen = false, sheetInHistory = false, popWaiter = null, pendingPush = false;
function pushRoute(){ try{ history.pushState({route}, ''); }catch(e){} }
function openSheet(title, body, onSubmit, okLabel='Salva', danger=false){
  sheetSubmit = onSubmit;
  if(!sheetOpen){ sheetOpen = true; try{ history.pushState({route, sheet:1}, ''); sheetInHistory = true; }catch(e){} }
  if(!onSubmit){
    $('#sheetCard').innerHTML = `<h3>${title}</h3>${body}<button type="button" class="btn ghost block" data-act="closeSheet">Annulla</button>`;
    $('#sheet').classList.remove('hidden'); return;
  }
  $('#sheetCard').innerHTML = `<h3>${title}</h3><form id="sheetForm" novalidate>${body}
    <div class="sheet-actions"><button type="button" class="btn ghost" data-act="closeSheet">Annulla</button>
    <button type="submit" class="btn ${danger?'danger':''}">${okLabel}</button></div></form>`;
  $('#sheet').classList.remove('hidden');
  const f = $('#sheetForm');
  f.addEventListener('submit', ev => { ev.preventDefault(); const fd = Object.fromEntries(new FormData(f).entries()); if(sheetSubmit(fd, f) !== false) closeSheet(); });
  f.addEventListener('change', ev => { if(ev.target.name==='sesso'){ const w=f.querySelector('#depWrap'); if(w) w.style.display = ev.target.value==='gallina'?'':'none'; } });
}
function closeSheet(){
  $('#sheet').classList.add('hidden'); sheetSubmit = null;
  if(!sheetOpen) return; sheetOpen = false;
  const done = () => { if(pendingPush){ pendingPush = false; pushRoute(); } };
  if(sheetInHistory){ sheetInHistory = false; popWaiter = done; history.back(); setTimeout(() => { if(popWaiter === done){ popWaiter = null; done(); } }, 500); }
  else done();
}
window.addEventListener('popstate', e => {
  if(popWaiter){ const f = popWaiter; popWaiter = null; f(); return; }
  if(sheetOpen){ $('#sheet').classList.add('hidden'); sheetOpen = false; sheetInHistory = false; sheetSubmit = null; return; }
  route = e.state?.route || {name:'home'}; render(); window.scrollTo(0,0);
});
function confirmSheet(msg, okLabel, cb){ openSheet('Sei sicuro?', `<p style="margin:0 0 14px">${msg}</p>`, () => { cb(); }, okLabel, true); }
function invalid(f, name, msg){ const el=f.querySelector(`[name="${name}"]`); if(el){ el.focus(); el.style.borderColor='var(--danger)'; } toast(msg); return false; }

/* ================= Router ================= */
let route = { name:'home' };
const ui = { uovaData: today(), uovaPollaio: '', filtro: 'tutti', mangimePollaio: '', tuttiAcquisti: false };
function go(r){ route = r; render(); window.scrollTo(0,0); if(sheetOpen) pendingPush = true; else pushRoute(); }
function render(){
  charts.forEach(c => c.destroy()); charts = []; after = [];
  const V = VIEWS[route.name] || VIEWS.home;
  const r = V(route);
  const back = r.back ? `<button class="backlink" data-act="back" data-to='${esc(JSON.stringify(r.back))}'>${I('back',20,2.6)} ${esc(r.backLabel||'Indietro')}</button>` : '';
  const v = $('#view'); v.classList.toggle('withbar', !!r.bar);
  v.innerHTML = (storageOk ? '' : `<div class="banner">Il salvataggio non è disponibile qui: i dati restano solo finché la pagina è aperta. Esporta un backup da Altro.</div>`) + back + r.html;
  const tab = r.tab || route.name;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === tab));
  after.forEach(f => f());
}

/* ================= Viste ================= */
const pl = (n, s, p) => `${nf0.format(n)} ${n===1 ? s : p}`;
function saluto(){ const h = new Date().getHours(); return h < 13 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera'; }
const P = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  barn:'<path d="M3 21V10l9-6 9 6v11"/><path d="M9 21v-6h6v6"/>',
  egg:'<path d="M12 3c-3.9 0-7 6-7 10a7 7 0 0 0 14 0c0-4-3.1-10-7-10z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  bag:'<path d="M6 8h12l-1.2 12.2a1 1 0 0 1-1 .8H8.2a1 1 0 0 1-1-.8z"/><path d="M8 8l1.2-4h5.6L16 8"/>',
  back:'<path d="M15 6l-6 6 6 6"/>', chev:'<path d="M9 6l6 6-6 6"/>', next:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/>', ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  check:'<path d="M5 12l5 5 9-10"/>', cal:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>', trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  down:'<path d="M12 4v12M6 10l6 6 6-6M4 20h16"/>', up:'<path d="M12 20V8M6 14l6-6 6 6M4 4h16"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/>', phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>'
};
const I = (k, s=24, w=2.2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;
const HEN_COLS = ['#F4C542','#E9A23B','#C98B2E','#D9822B','#F2D27A','#E8B04A'];
function avCol(a){ if(!isHen(a)) return '#E07856'; let h = 0; for(const c of String(a.id||a.nome)) h = (h*31 + c.charCodeAt(0)) >>> 0; return HEN_COLS[h % HEN_COLS.length]; }
function avatar(a, size=44){ const ch = ((a.nome||'?').trim()[0]||'?').toUpperCase(); return `<span class="av" aria-hidden="true" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.43)}px;background:${avCol(a)}">${esc(ch)}</span>`; }
const LETTERE = ['D','L','M','M','G','V','S'];
const fmtDBreve = s => { const d = parseD(s); return d.toLocaleDateString('it-IT',{day:'numeric', month:'long'}); };
const fmtDGiorno = s => { const d = parseD(s); return d.toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'}); };
function head(title, eyebrow, sub){ return `<div class="head">${eyebrow?`<span class="eyebrow">${eyebrow}</span>`:''}<h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>`; }
function emptyCard(icon, text, btn){ return `<div class="card empty"><div class="ei">${I(icon,30)}</div><p>${text}</p>${btn||''}</div>`; }

function sackStatus(list, fs){
  if(!list.length || !fs.kgDay) return null;
  const last = [...list].sort((a,b) => a.data<b.data?-1:1).at(-1);
  const rest = Math.max(0, (+last.kg||0) - daysBetween(last.data, today()) * fs.kgDay);
  const days = rest / fs.kgDay;
  return { last, rest, days, fine: addDays(today(), Math.floor(days)), pct: last.kg ? rest/last.kg : 0 };
}
function alerts(){
  const out = [], vivi = attivi(db.animali);
  const fs = feedStats(db.mangime, vivi.length), ss = sackStatus(db.mangime, fs);
  if(ss && ss.days <= 7) out.push({ cls:'warn', icon:'warn', act:'tab', v:'mangime',
    t: ss.days < 1 ? 'Il mangime dovrebbe essere finito' : 'Il mangime sta finendo',
    s: ss.days < 1 ? 'Registra il nuovo acquisto' : `Ne rimane per circa ${pl(Math.max(1,Math.round(ss.days)),'giorno','giorni')}` });
  vivi.filter(isHen).forEach(h => {
    const s = henStats(h); if(s.tot < 6 || !s.last) return;
    const d = daysBetween(s.last, today()), perWeek = s.s30/30*7;
    if(d >= 3 && perWeek >= 2.5) out.push({ hen:h, r:{name:'animale', id:h.id}, t:`${h.nome} non depone da ${d} giorni`, s:`${pollaio(h.pollaioId)?.nome||''} · di solito ${nf0.format(perWeek)} a settimana` });
  });
  return out.slice(0,4);
}
function alertHtml(a){
  const attr = a.r ? `data-act="open" data-r='${JSON.stringify(a.r)}'` : `data-act="${a.act}" data-v="${a.v}"`;
  const ic = a.hen ? avatar(a.hen, 40) : `<span class="ai">${I(a.icon,22)}</span>`;
  return `<button class="alert ${a.cls||''}" ${attr}>${ic}<span class="at"><b>${esc(a.t)}</b><small>${esc(a.s)}</small></span>${I('chev',20,2.4)}</button>`;
}

const VIEWS = {
home(){
  const t = today(), vivi = attivi(db.animali), hens = vivi.filter(isHen);
  const all = eggEntries(), oggi = sumQ(all.filter(e => e.d===t));
  const fatte = hens.filter(h => (+db.uova[h.id+'|'+t]||0) > 0).length;
  let h = head(`${saluto()}!`, fmtDGiorno(t));
  if(!db.pollai.length) return { html: h + emptyCard('barn', 'Per iniziare crea il tuo primo pollaio, poi aggiungi galline e galli.', `<button class="btn" data-act="addPollaio">${I('plus',20,2.6)} Crea il primo pollaio</button>`) + firma() };
  h += `<section class="hero">
    <div class="hero-top"><div><span class="hl">Uova raccolte oggi</span><div class="bigrow"><span class="big">${oggi}</span><span class="unit">${oggi===1?'uovo':'uova'}</span></div></div><span class="eggbadge">${I('egg',30)}</span></div>
    ${hens.length ? `<div><div class="prog-l"><span>Galline che hanno deposto</span><span>${fatte} su ${hens.length}</span></div><div class="progress"><i style="width:${Math.round(fatte/hens.length*100)}%"></i></div></div>` : ''}
    <button class="btnw" data-act="tab" data-v="uova">${oggi ? 'Continua la raccolta' : 'Inizia la raccolta'} ${I('next',20,2.4)}</button>
  </section>`;
  h += `<h2 class="st">Cosa vuoi fare?</h2><div class="actions3">
    <button class="act" data-act="tab" data-v="uova"><span class="ib egg">${I('egg',26)}</span>Segna le uova</button>
    <button class="act" data-act="addAnimale"><span class="ib green">${I('plus',26,2.4)}</span>Nuovo animale</button>
    <button class="act" data-act="addMangime"><span class="ib feed">${I('bag',26)}</span>Compra mangime</button></div>`;
  const al = alerts();
  h += `<h2 class="st">Da tenere d'occhio</h2>` + (al.length ? al.map(alertHtml).join('') :
    `<div class="alert ok"><span class="ai">${I('ok',22)}</span><span class="at"><b>Tutto in ordine</b><small>Nessuna gallina ferma e mangime a sufficienza</small></span></div>`);
  const s7 = sumQ(all.filter(e => e.d >= addDays(t,-6))), p7 = sumQ(all.filter(e => e.d >= addDays(t,-13) && e.d < addDays(t,-6)));

pollaio(r){

  let list = ui.filtro==='galline' ? vivi.filter(isHen) : ui.filtro==='galli' ? vivi.filter(a=>!isHen(a)) : ui.filtro==='inattivi' ? tutti.filter(a=>(a.stato||'attivo')!=='attivo') : vivi;

    const since = addDays(t,-29);

animale(r){

      const dl = s.last ? daysBetween(s.last, today()) : null;

    ${has ? `<button class="addrow egg" data-act="addEggs"><span class="ib">${I('egg',26)}</span><span class="at"><b>Uova raccolte</b><small>Segna le uova di oggi gallina per gallina</small></span></button>
    <button class="addrow green" data-act="addAnimale"><span class="ib">${I('user',26)}</span><span class="at"><b>Nuovo animale</b><small>Una gallina o un gallo</small></span></button>` : ''}
    <button class="addrow feed" data-act="addMangime"><span class="ib">${I('bag',26)}</span><span class="at"><b>Acquisto mangime</b><small>Data, chili e quanto hai speso</small></span></button>
    <button class="addrow gray" data-act="addPollaio"><span class="ib">${I('barn',26)}</span><span class="at"><b>Nuovo pollaio</b><small>Per tenere separati gli animali</small></span></button>`, null);
}

/* ================= Form ================= */
function formPollaio(p){
  openSheet(p ? 'Modifica pollaio' : 'Nuovo pollaio', `
    <label class="f"><span>Nome</span><input name="nome" value="${esc(p?.nome||'')}" placeholder="es. Pollaio grande" autocomplete="off"></label>
    <label class="f"><span>Note</span><textarea name="note" placeholder="Posizione, dimensioni…">${esc(p?.note||'')}</textarea></label>`,
  (fd, f) => {
    if(!fd.nome.trim()) return invalid(f,'nome','Inserisci il nome del pollaio');
    if(p){ p.nome = fd.nome.trim(); p.note = fd.note.trim(); }
    else { const np = {id:uid(), nome:fd.nome.trim(), note:fd.note.trim()}; db.pollai.push(np); saveDB(); go({name:'pollaio', id:np.id}); }
    saveDB(); render(); toast('Pollaio salvato');
  });
}
function formAnimale(a, pid){
  const sesso = a?.sesso || 'gallina';
  openSheet(a ? 'Modifica animale' : 'Nuovo animale', `
    <label class="f"><span>Nome</span><input name="nome" value="${esc(a?.nome||'')}" placeholder="es. Bianchina" autocomplete="off"></label>
    <div class="segr" role="radiogroup" aria-label="Sesso">
      <input type="radio" name="sesso" id="sx1" value="gallina" ${sesso==='gallina'?'checked':''}><label for="sx1">Gallina</label>
      <input type="radio" name="sesso" id="sx2" value="gallo" ${sesso==='gallo'?'checked':''}><label for="sx2">Gallo</label></div>
    <label class="f"><span>Razza</span><input name="razza" list="razze" value="${esc(a?.razza||'')}" placeholder="Scegli o scrivi" autocomplete="off">
      <datalist id="razze">${[...new Set([...RAZZE, ...db.animali.map(x=>x.razza).filter(Boolean)])].map(r=>`<option value="${esc(r)}">`).join('')}</datalist></label>
    <label class="f"><span>Data di nascita</span><input type="date" name="nascita" value="${a?.nascita||''}" max="${today()}"></label>
    <div id="depWrap" style="${sesso==='gallina'?'':'display:none'}"><label class="f"><span>Data inizio deposizione uova</span><input type="date" name="inizioDeposizione" value="${a?.inizioDeposizione||''}" max="${today()}"></label></div>
    <label class="f"><span>Pollaio</span><select name="pollaioId">${pollaioOptions(a?.pollaioId||pid)}</select></label>
    <label class="f"><span>Anello / segno di riconoscimento</span><input name="anello" value="${esc(a?.anello||'')}" placeholder="facoltativo" autocomplete="off"></label>
    <label class="f"><span>Stato</span><select name="stato">${['attivo','venduto','ceduto','deceduto'].map(s=>`<option ${ (a?.stato||'attivo')===s?'selected':''}>${s}</option>`).join('')}</select></label>
    <label class="f"><span>Note</span><textarea name="note">${esc(a?.note||'')}</textarea></label>`,
  (fd, f) => {
    if(!fd.nome.trim()) return invalid(f,'nome','Dai un nome all’animale');
    if(fd.nascita && fd.inizioDeposizione && fd.inizioDeposizione < fd.nascita) return invalid(f,'inizioDeposizione','La deposizione non può iniziare prima della nascita');
    const data = { nome:fd.nome.trim(), sesso:fd.sesso, razza:fd.razza.trim(), nascita:fd.nascita, inizioDeposizione: fd.sesso==='gallina' ? (fd.inizioDeposizione||'') : '',
                   pollaioId:fd.pollaioId, anello:fd.anello.trim(), stato:fd.stato, note:fd.note.trim() };
    if(a) Object.assign(a, data);
    else { const na = {id:uid(), ...data}; db.animali.push(na); }
    saveDB(); render(); toast(a ? 'Modifiche salvate' : 'Animale aggiunto');
  });
}
function formMangime(m){
  const def = m || { data: today(), pollaioId: ui.mangimePollaio || '' };
  openSheet(m ? 'Modifica acquisto' : 'Nuovo acquisto mangime', `
    <label class="f"><span>Data acquisto</span><input type="date" name="data" value="${def.data}" max="${today()}"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label class="f"><span>Quantità (kg)</span><input name="kg" inputmode="decimal" value="${m?String(m.kg).replace('.',','):''}" placeholder="25"></label>
      <label class="f"><span>Costo totale (€)</span><input name="costo" inputmode="decimal" value="${m?String(m.costo).replace('.',','):''}" placeholder="18,50"></label></div>
    <label class="f"><span>Tipo di mangime</span><input name="tipo" list="tipi" value="${esc(m?.tipo||'')}" placeholder="es. Pellet ovaiole, mais spezzato" autocomplete="off">
      <datalist id="tipi">${[...new Set(db.mangime.map(x=>x.tipo).filter(Boolean))].map(r=>`<option value="${esc(r)}">`).join('')}</datalist></label>
    <label class="f"><span>Per quale pollaio</span><select name="pollaioId">${pollaioOptions(def.pollaioId, 'Tutti / generale')}</select></label>
    <label class="f"><span>Note</span><input name="note" value="${esc(m?.note||'')}" placeholder="Negozio, marca…" autocomplete="off"></label>
    ${m ? `<button type="button" class="btn danger block" data-act="delMangime" data-id="${m.id}" style="margin-bottom:6px">Elimina acquisto</button>` : ''}`,
  (fd, f) => {
    const kg = parseFloat(String(fd.kg).replace(',','.')), costo = parseFloat(String(fd.costo).replace(',','.'));
    if(!fd.data) return invalid(f,'data','Inserisci la data');
    if(!(kg > 0)) return invalid(f,'kg','Inserisci i kg acquistati');
    if(!(costo >= 0)) return invalid(f,'costo','Inserisci il costo');
    const data = { data:fd.data, kg, costo, tipo:fd.tipo.trim(), pollaioId:fd.pollaioId, note:fd.note.trim() };
    if(m) Object.assign(m, data); else db.mangime.push({id:uid(), ...data});
    saveDB(); render(); toast('Acquisto salvato');
  });
}

/* ================= Azioni ================= */
const ACT = {
  tab: d => go({name:d.v}),
  add: () => addMenu(),
  addEggs: () => { ui.uovaData = today(); route = {name:'uova'}; render(); window.scrollTo(0,0); pendingPush = true; closeSheet(); },
  uovaPollaio: d => { ui.uovaPollaio = d.v; render(); },
  toggleAcquisti: () => { ui.tuttiAcquisti = !ui.tuttiAcquisti; render(); },
  installApp: async () => { if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt = null; render(); },
  open: d => go(JSON.parse(d.r)),
  back: d => go(JSON.parse(d.to)),
  closeSheet: () => closeSheet(),
  addPollaio: () => formPollaio(null),
  editPollaio: d => formPollaio(pollaio(d.id)),
  delPollaio: d => {
    const p = pollaio(d.id), an = animaliDi(p.id);
    confirmSheet(`Eliminare <b>${esc(p.nome)}</b>${an.length?` insieme ai suoi ${an.length} animali e a tutte le loro uova registrate`:''}? L'operazione non si può annullare.`, 'Elimina', () => {
      const ids = new Set(an.map(a=>a.id));
      db.animali = db.animali.filter(a => !ids.has(a.id));
      for(const k of Object.keys(db.uova)) if(ids.has(k.slice(0,k.lastIndexOf('|')))) delete db.uova[k];
      db.mangime.forEach(m => { if(m.pollaioId===p.id) m.pollaioId=''; });
      db.pollai = db.pollai.filter(x => x.id!==p.id);
      saveDB(); go({name:'pollai'}); toast('Pollaio eliminato');
    });
  },
  filtro: d => { ui.filtro = d.v; render(); },
  addAnimale: d => { if(!db.pollai.length){ toast('Crea prima un pollaio'); return formPollaio(null); } formAnimale(null, d.pollaio || (route.name==='pollaio' ? route.id : undefined)); },
  editAnimale: d => formAnimale(animale(d.id)),
  delAnimale: d => {
    const a = animale(d.id);
    confirmSheet(`Eliminare <b>${esc(a.nome||'questo animale')}</b> e tutte le sue uova registrate? Se è stato venduto o è morto puoi invece cambiarne lo stato, così le statistiche restano.`, 'Elimina', () => {
      for(const k of Object.keys(db.uova)) if(k.startsWith(a.id+'|')) delete db.uova[k];
      db.animali = db.animali.filter(x => x.id!==a.id);
      saveDB(); go({name:'pollaio', id:a.pollaioId}); toast('Animale eliminato');
    });
  },
  eggsFor: d => { ui.uovaPollaio = d.id; ui.uovaData = today(); go({name:'uova'}); },
  dayPrev: () => { ui.uovaData = addDays(ui.uovaData,-1); render(); },
  dayToday: () => { ui.uovaData = today(); render(); },
  dayNext: () => { if(ui.uovaData < today()){ ui.uovaData = addDays(ui.uovaData,1); render(); } },
  egg: d => {
    const k = d.id+'|'+ui.uovaData, n = Math.max(0, (+db.uova[k]||0) + (+d.d));
    if(n) db.uova[k] = n; else delete db.uova[k];
    const a = animale(d.id);
    if(n > 0 && a && (!a.inizioDeposizione || ui.uovaData < a.inizioDeposizione)){
      a.inizioDeposizione = ui.uovaData; toast(`Inizio deposizione di ${a.nome}: ${fmtD(ui.uovaData)}`);
    }
    saveDB(); render();
  },
  addMangime: () => formMangime(null),
  editMangime: d => formMangime(db.mangime.find(m => m.id===d.id)),
  delMangime: d => { confirmSheet('Eliminare questo acquisto di mangime?', 'Elimina', () => { db.mangime = db.mangime.filter(m=>m.id!==d.id); saveDB(); render(); toast('Acquisto eliminato'); }); },
  export: () => {
    const txt = JSON.stringify(db, null, 1);
    try{
      const url = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
      const a = document.createElement('a'); a.href = url; a.download = `MOrto22-backup-${today()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast('Backup esportato');
    }catch(e){ ACT.copyBackup(); }
  },
  copyBackup: async () => {
    try{ await navigator.clipboard.writeText(JSON.stringify(db)); toast('Backup copiato: incollalo in una nota o in un file'); }
    catch(e){ toast('Copia non riuscita su questo dispositivo'); }
  },
  import: () => $('#importFile').click(),
  reset: () => confirmSheet('Cancellare <b>tutti</b> i pollai, gli animali, le uova e gli acquisti? Fai prima un backup.', 'Cancella tutto', () => { db = normalize(null); saveDB(); go({name:'home'}); toast('Dati cancellati'); }),
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  const f = ACT[t.dataset.act]; if(f){ e.preventDefault(); f(t.dataset, t); }
});
$('#sheet').addEventListener('click', e => { if(e.target.id==='sheet') closeSheet(); });
document.addEventListener('change', e => {
  if(e.target.id==='uovaData' && e.target.value){ ui.uovaData = e.target.value > today() ? today() : e.target.value; render(); }
  if(e.target.id==='uovaPollaio'){ ui.uovaPollaio = e.target.value; render(); }
  if(e.target.id==='mangimePollaio'){ ui.mangimePollaio = e.target.value; render(); }
});
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(!data || !Array.isArray(data.pollai)) throw new Error('formato');
    confirmSheet(`Importare il backup <b>${esc(file.name)}</b>? Sostituirà i dati attuali (${data.pollai.length} pollai, ${(data.animali||[]).length} animali).`, 'Importa', () => { db = normalize(data); saveDB(); go({name:'home'}); toast('Backup importato'); });
  }catch(err){ toast('File non valido: serve un backup di MOrto22'); }
});
window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change', () => render());
try{ history.replaceState({route}, ''); }catch(e){}
render();
setTimeout(() => { const sp = $('#splash'); sp.classList.add('out'); setTimeout(() => sp.remove(), 600); }, 1300);
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if(route.name==='backup') render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('MOrto22 installata'); });
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
</body>
</html>
